kind = "web"
previewPath = "/"
title = "Quản lý khách hàng & thuê bao"
description = "Ứng dụng quản lý khách hàng, tài khoản nguồn và thuê bao với dashboard theo dõi hạn, gia hạn, thu hồi, lịch sử và sẵn sàng tích hợp Telegram AI."
version = "1.0.0"
id = "artifacts/subscription-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20121

[services.development]
run = "pnpm --filter @workspace/subscription-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/subscription-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/subscription-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20121"
BASE_PATH = "/"
